<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="ntam Island Network — Personal digital space"
    />

    <link
      rel="icon"
      href="https://calwzopyjitbtahiafzw.supabase.co/storage/v1/object/sign/web-pic/icon/avt_libai.jpg?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV84Mzg1MDYzNy1jNjQwLTQwYjQtYTk0OS1hODY4YmI0Yzk2YmMiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ3ZWItcGljL2ljb24vYXZ0X2xpYmFpLmpwZyIsImlhdCI6MTc2NjAzNzcwMywiZXhwIjo4NjU2OTg4MTg1fQ.1JSZExUNh3_1uiHZ00ayOskz7UX3S3DpVEtKPkKVwu8"
      type="image/jpeg"
    />

    <title>ntam Island Network</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Existing global styles -->
    <link rel="stylesheet" href="style/components.css" />
    <link rel="stylesheet" href="style/themes.css" />
    <link rel="stylesheet" href="style/command-center.css" />
  </head>

  <body class="command-page">

    <!-- =========================================================
         LEGACY GLOBAL LAYERS
         ========================================================= -->

    <div
      class="awakening-bg"
      aria-hidden="true"
    ></div>

    <div
      class="noise-layer"
      aria-hidden="true"
    ></div>


    <!-- =========================================================
         GLOBAL DEEP SPACE BACKGROUND
         Nằm ngoài content để tạo không gian xung quanh website
         ========================================================= -->

    <div
      class="space-layer space-layer--global"
      aria-hidden="true"
    >
      <!-- Nebula -->
      <div class="space-nebula"></div>

      <!-- Far stars -->
      <div class="space-stars space-stars--far"></div>

      <!-- Mid stars -->
      <div class="space-stars space-stars--mid"></div>

      <!-- Near stars -->
      <div class="space-stars space-stars--near"></div>

      <!-- Meteor shower -->
      <div class="meteor-shower">

        <span class="meteor"></span>
        <span class="meteor"></span>
        <span class="meteor"></span>
        <span class="meteor"></span>
        <span class="meteor"></span>
        <span class="meteor"></span>
        <span class="meteor"></span>
        <span class="meteor"></span>
        <span class="meteor"></span>
        <span class="meteor"></span>
        <span class="meteor"></span>
        <span class="meteor"></span>

      </div>

      <!-- Rare fireball flash -->
      <div
        class="space-flash"
      ></div>
    </div>


    <!-- =========================================================
         MAIN CONTENT
         ========================================================= -->

    <main class="cmd-facility home-sanctuary">

      <!-- =======================================================
           DIGITAL SANCTUARY
           ======================================================== -->

      <section
        class="hero cmd-header cmd-panel home-sanctuary-hero deep-space"
        aria-label="NTAM Digital Sanctuary"
      >

        <!-- Legacy layers -->
        <div
          class="hero-background"
          aria-hidden="true"
        ></div>

        <div
          class="hero-light-layer"
          aria-hidden="true"
        ></div>

        <div
          class="hero-glow-layer"
          aria-hidden="true"
        ></div>


        <!-- =====================================================
             HERO LOCAL SPACE
             ====================================================== -->

        <div
          class="space-layer"
          aria-hidden="true"
        >

          <div class="space-nebula"></div>

          <div class="space-stars space-stars--far"></div>

          <div class="space-stars space-stars--mid"></div>

          <div class="space-stars space-stars--near"></div>

          <div class="meteor-shower">

            <span class="meteor"></span>
            <span class="meteor"></span>
            <span class="meteor"></span>
            <span class="meteor"></span>
            <span class="meteor"></span>
            <span class="meteor"></span>
            <span class="meteor"></span>
            <span class="meteor"></span>
            <span class="meteor"></span>
            <span class="meteor"></span>
            <span class="meteor"></span>
            <span class="meteor"></span>

          </div>

          <div
            class="space-flash"
          ></div>

        </div>


        <!-- =====================================================
             HERO CONTENT
             ====================================================== -->

        <div class="hero-container cmd-header-inner">

          <!-- Central digital core -->

          <div
            class="home-core"
            aria-hidden="true"
          >

            <div
              class="home-core-orbit home-core-orbit--outer"
            ></div>

            <div
              class="home-core-orbit home-core-orbit--inner"
            ></div>

            <div class="home-core-center">

              <span class="home-core-mark">
                N
              </span>

            </div>

          </div>


          <!-- Hero typography -->

          <div
            class="hero-content cmd-header-main"
          >

            <h1 class="hero-title cmd-system-name">
              NTAM
            </h1>

            <p class="hero-subtitle cmd-system-desc">
              Personal digital space
            </p>

          </div>


          <!-- System state -->

          <div
            class="cmd-header-meta home-state-meta"
            aria-label="Current system state"
          >

            <span class="cmd-meta-line cmd-meta-line--live">
              ONLINE
            </span>

            <span class="cmd-meta-line">
              STABLE
            </span>

          </div>


          <!-- Scroll indicator -->

          <div
            class="scroll-hint"
            aria-hidden="true"
          >

            <div class="scroll-arrow">
              ↓
            </div>

          </div>

        </div>

      </section>


      <!-- =======================================================
           CURRENT STATE
           ======================================================== -->

      <section class="home-state cmd-panel">

        <div class="container cmd-panel-inner">

          <div class="cmd-panel-label">

            <span class="cmd-module-id-sm">
              [STATE]
            </span>

            <span class="cmd-panel-title">
              CURRENT STATE
            </span>

          </div>


          <div
            class="cmd-panel-divider"
            aria-hidden="true"
          ></div>


          <div class="home-state-grid">

            <div class="home-state-item">

              <span class="cmd-module-id-sm">
                NETWORK
              </span>

              <strong>
                ONLINE
              </strong>

            </div>


            <div class="home-state-item">

              <span class="cmd-module-id-sm">
                SYSTEM
              </span>

              <strong>
                STABLE
              </strong>

            </div>


            <div class="home-state-item">

              <span class="cmd-module-id-sm">
                SESSION
              </span>

              <strong>
                ACTIVE
              </strong>

            </div>


            <div class="home-state-item">

              <span class="cmd-module-id-sm">
                STATUS
              </span>

              <strong>
                READY
              </strong>

            </div>

          </div>

        </div>

      </section>


      <!-- =======================================================
           PERSONAL SIGNAL
           ======================================================== -->

      <section class="home-signal">

        <div class="container">

          <div class="home-signal-content">

            <span class="cmd-module-id-sm">
              [PERSONAL SIGNAL]
            </span>

            <blockquote>
              Somewhere between
              curiosity and creation.
            </blockquote>

            <span class="cmd-meta-line">
              NTAM / PERSONAL DIGITAL SPACE
            </span>

          </div>

        </div>

      </section>


      <!-- =======================================================
           DIGITAL HORIZON
           ======================================================== -->

      <section class="home-horizon">

        <div
          class="home-horizon-field"
          aria-hidden="true"
        >

          <span
            class="home-horizon-line home-horizon-line--one"
          ></span>

          <span
            class="home-horizon-line home-horizon-line--two"
          ></span>

          <span
            class="home-horizon-line home-horizon-line--three"
          ></span>

          <span
            class="home-horizon-core"
          ></span>

        </div>


        <div class="home-horizon-content">

          <span class="cmd-module-id-sm">
            NTAM ISLAND NETWORK
          </span>

          <h2>
            ALWAYS IN PROGRESS
          </h2>

          <span class="cmd-meta-line">
            PERSONAL DIGITAL SPACE
          </span>

        </div>

      </section>

    </main>


    <!-- =========================================================
         EXISTING HOME LOGIC
         ========================================================= -->

    <script
      type="module"
      src="js/modules/home.js"
    ></script>

  </body>
</html>
