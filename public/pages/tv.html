<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Media</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../style/components.css" />
  <link rel="stylesheet" href="../style/themes.css" />
  <link rel="stylesheet" href="../style/tv.css" />
  <link rel="stylesheet" href="../style/media-repository.css" />

  <link
    rel="icon"
    href="https://calwzopyjitbtahiafzw.supabase.co/storage/v1/object/sign/web-pic/icon/avt_libai.jpg?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV84Mzg1MDYzNy1jNjQwLTQwYjQtYTk0OS1hODY4YmI0Yzk2YmMiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ3ZWItcGljL2ljb24vYXZ0X2xpYmFpLmpwZyIsImlhdCI6MTc2NjAzNzcwMywiZXhwIjo4NjU2OTg4MTg1MDN9.1JSZExUNh3_1uiHZ00ayOskz7UX3S3DpVEtKPkKVwu8"
    type="image/jpeg"
  />
</head>


<body class="repository-page">

  <div
    class="film-grain-overlay"
    aria-hidden="true"
  ></div>

  <audio
    id="ambientAudio"
    loop
    preload="none"
    volume="0.1"
  ></audio>


  <main class="container tv-section media-facility">


    <!-- HEADER -->
    <header
      class="media-header media-panel"
      aria-label="Media Archive"
    >

      <div class="media-header-main">

        <span class="media-module-id">
          [MED-001]
        </span>

        <div class="media-header-text">

          <h1 class="page-title cinematic-title">
            NTAM MEDIA ARCHIVE
          </h1>

          <p class="media-system-desc">
            Video &amp; Media Library
          </p>

        </div>

      </div>


      <div
        class="media-header-meta"
        aria-label="Repository status"
      >

        <span class="media-meta-line media-meta-line--live">
          STATUS: READY
        </span>

      </div>

    </header>


    <!-- MAIN LAYOUT -->
    <div class="media-layout">


      <!-- CATEGORIES -->
      <aside
        class="media-sidebar media-panel"
        aria-label="Media categories"
      >

        <div class="media-panel-label">

          <span class="media-panel-title">
            MEDIA
          </span>

        </div>

        <div
          class="media-panel-divider"
          aria-hidden="true"
        ></div>


        <nav class="media-category-nav">

          <span class="media-category-entry media-category-entry--active">
            ALL MEDIA
          </span>

          <span class="media-category-entry">
            VIDEO
          </span>

          <span class="media-category-entry">
            AUDIO
          </span>

          <span class="media-category-entry">
            IMAGES
          </span>

          <span class="media-category-entry">
            DOCUMENTS
          </span>

        </nav>

      </aside>


      <!-- MAIN CONTENT -->
      <section
        class="media-main"
        aria-label="Media content"
      >


        <!-- BREADCRUMB -->
        <nav
          class="tv-breadcrumb media-breadcrumb"
          id="tvBreadcrumb"
          aria-label="Navigation path"
        >

          <span class="crumb active">
            MEDIA
          </span>

        </nav>


        <!-- SEARCH & FILTER -->
        <div class="top-bar media-top-bar">

          <div
            class="filter-bar media-filter-bar media-panel"
          >

            <div class="media-panel-label media-filters-label">

              <span class="media-module-id-sm">
                [QRY-02]
              </span>

              <span class="media-panel-title">
                SEARCH &amp; FILTER
              </span>

            </div>

            <div
              class="media-panel-divider media-panel-divider--inset"
              aria-hidden="true"
            ></div>


            <div class="media-filters-row">


              <!-- Search -->
              <div class="media-search-wrap">

                <label
                  for="searchInput"
                  class="media-field-label"
                >
                  SEARCH
                </label>

                <input
                  type="text"
                  id="searchInput"
                  placeholder="Search media..."
                />

              </div>


              <!-- Filters -->
              <div class="media-select-group">

                <div class="media-select-wrap">

                  <label
                    for="seriesFilter"
                    class="media-field-label"
                  >
                    COLLECTION
                  </label>

                  <select id="seriesFilter">

                    <option value="">
                      All collections
                    </option>

                  </select>

                </div>


                <div class="media-select-wrap">

                  <label
                    for="genreFilter"
                    class="media-field-label"
                  >
                    TYPE
                  </label>

                  <select id="genreFilter">

                    <option value="">
                      All types
                    </option>

                  </select>

                </div>


                <div class="media-select-wrap">

                  <label
                    for="regionFilter"
                    class="media-field-label"
                  >
                    REGION
                  </label>

                  <select id="regionFilter">

                    <option value="">
                      All regions
                    </option>

                  </select>

                </div>

              </div>

            </div>

          </div>

        </div>


        <!-- PLAYER -->
        <div
          class="tv-player-container media-player-panel media-panel"
        >

          <div class="media-panel-label">

            <span class="media-module-id-sm">
              [PLY-03]
            </span>

            <span class="media-panel-title">
              PLAYER
            </span>

          </div>

          <div
            class="media-panel-divider media-panel-divider--inset"
            aria-hidden="true"
          ></div>


          <video
            id="videoPlayer"
            controls
            preload="metadata"
          ></video>


          <div class="video-info media-video-info">

            <span class="media-field-label">
              CURRENT
            </span>

            <span id="currentVideoTitle">
              No media selected
            </span>

          </div>

        </div>


        <!-- MEDIA LIST -->
        <div class="media-feed-header">

          <div class="media-panel-label">

            <span class="media-module-id-sm">
              [LIB-04]
            </span>

            <span class="media-panel-title">
              MEDIA LIBRARY
            </span>

          </div>

        </div>


        <div
          id="tvList"
          class="tv-list media-asset-list"
        ></div>


      </section>


    </div>

  </main>


  <script
    type="module"
    src="../js/modules/tv_entry.js"
  ></script>

</body>
</html>
