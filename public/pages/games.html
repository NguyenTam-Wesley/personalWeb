<!DOCTYPE html>

<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../style/components.css" />
  <link rel="stylesheet" href="../style/themes.css" />
  <link rel="stylesheet" href="../style/games.css" />
  <link rel="stylesheet" href="../style/training-simulator.css" />

  <link
    rel="icon"
    href="https://calwzopyjitbtahiafzw.supabase.co/storage/v1/object/sign/web-pic/icon/avt_libai.jpg?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV84Mzg1MDYzNy1jNjQwLTQwYjQtYTk0OS1hODY4YmI0Yzk2YmMiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ3ZWItcGljL2ljb24vYXZ0X2xpYmFpLmpwZyIsImlhdCI6MTc2NjAzNzcwMywiZXhwIjo4NjU2OTg4MTg1MDN9.1JSZExUNh3_1uiHZ00ayOskz7UX3S3DpVEtKPkKVwu8"
  />
</head>

<body class="games-page sim-page">

  <main class="sim-container">

    <div class="sim-facility">

      <!-- HEADER -->
      <header class="sim-header sim-panel" aria-label="Game Archive">

        <div class="sim-module-id">
          [SIM-001]
        </div>

        <div class="sim-header-body">
          <h1 class="sim-system-name">
            NTAM GAME ARCHIVE
          </h1>

          <p class="sim-system-desc">
            Game Library
          </p>
        </div>

        <div class="sim-header-meta">
          <span class="sim-meta-line sim-meta-line--live">
            STATUS: READY
          </span>
        </div>

      </header>


      <!-- MAIN LAYOUT -->
      <div class="sim-layout">

        <!-- GAME FILTER -->
        <aside
          class="sim-index-panel sim-panel"
          aria-label="Game filters"
        >

          <div class="sim-panel-label">
            <span class="sim-panel-title">
              GAMES
            </span>
          </div>

          <div
            class="sim-panel-divider"
            aria-hidden="true"
          ></div>

          <nav class="sim-index-nav">

            <span class="sim-index-entry sim-index-entry--active">
              ALL GAMES
            </span>

            <span class="sim-index-entry">
              STANDARD
            </span>

            <span class="sim-index-entry">
              ADVANCED
            </span>

          </nav>

        </aside>


        <!-- GAME LIST -->
        <section
          class="sim-modules-panel sim-panel"
          aria-label="Game modules"
        >

          <div class="sim-panel-label">

            <span class="sim-module-id-sm">
              [MOD-02]
            </span>

            <span class="sim-panel-title">
              GAME MODULES
            </span>

          </div>

          <div
            class="sim-panel-divider"
            aria-hidden="true"
          ></div>

          <div class="games-container sim-games-container">

            <div class="games-grid">
              <!-- Game modules rendered by GamesManager -->
            </div>

          </div>

        </section>


        <!-- PLAYER RECORD -->
        <aside
          class="sim-records-panel sim-panel"
          aria-label="Player records"
        >

          <div class="sim-panel-label">

            <span class="sim-panel-title">
              PLAYER
            </span>

          </div>

          <div
            class="sim-panel-divider"
            aria-hidden="true"
          ></div>

          <dl class="sim-records-meta">

            <div class="sim-records-row">
              <dt>STATUS</dt>
              <dd class="sim-records-value sim-records-value--ok">
                ACTIVE
              </dd>
            </div>

            <div class="sim-records-row">
              <dt>BEST SCORE</dt>
              <dd>—</dd>
            </div>

            <div class="sim-records-row">
              <dt>ATTEMPTS</dt>
              <dd>—</dd>
            </div>

          </dl>

        </aside>

      </div>

    </div>

  </main>


  <script
    type="module"
    src="../js/modules/game_entry.js"
  ></script>

</body>
</html>
