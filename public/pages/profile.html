<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
    />

    <link rel="stylesheet" href="../style/themes.css">
    <link rel="stylesheet" href="../style/components.css">
    <link rel="stylesheet" href="../style/profile.css">
    <link rel="stylesheet" href="../style/operator-dossier.css">

    <link
        rel="icon"
        href="https://calwzopyjitbtahiafzw.supabase.co/storage/v1/object/sign/web-pic/icon/avt_libai.jpg?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV84Mzg1MDYzNy1jNjQwLTQwYjQtYTk0OS1hODY4YmI0Yzk2YmMiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ3ZWItcGljL2ljb24vYXZ0X2xpYmFpLmpwZyIsImlhdCI6MTc2NjAzNzcwMywiZXhwIjo4NjU2OTg4MTg1MDN9.1JSZExUNh3_1uiHZ00ayOskz7UX3S3DpVEtKPkKVwu8"
        type="image/jpeg"
    >
</head>


<body class="dossier-page">

    <div class="container dossier-facility">

        <!-- HEADER -->
        <header
            class="dossier-header dossier-panel"
            aria-label="Profile"
        >

            <div class="dossier-header-main">

                <span class="dossier-module-id">
                    [OPR-001]
                </span>

                <div class="dossier-header-text">

                    <h1>
                        NTAM PROFILE
                    </h1>

                    <p class="dossier-system-desc">
                        Personal Profile
                    </p>

                </div>

            </div>


            <div
                class="dossier-header-meta"
                aria-label="Profile status"
            >

                <span class="dossier-meta-line dossier-meta-line--live">
                    STATUS: ACTIVE
                </span>

            </div>

        </header>


        <!-- MAIN -->
        <div class="dossier-layout">

            <!-- PROFILE -->
            <aside
                class="dossier-identity-panel dossier-panel"
                aria-label="Profile identity"
            >

                <div class="dossier-panel-label">

                    <span class="dossier-panel-title">
                        PROFILE
                    </span>

                </div>


                <div
                    class="dossier-panel-divider"
                    aria-hidden="true"
                ></div>


                <section class="profile-section dossier-identity-section">

                    <div class="profile-left dossier-profile-left">

                        <div class="profile-avatar dossier-avatar">

                            <img
                                id="profile-avatar-img"
                                src="/default-avatar.png"
                                alt="Profile avatar"
                                class="avatar-image"
                            >

                        </div>


                        <div class="profile-info dossier-profile-info">

                            <span class="dossier-field-label">
                                USERNAME
                            </span>

                            <h2
                                id="username-display"
                                class="username dossier-codename"
                            >
                                Loading...
                            </h2>


                            <div class="level-info dossier-rank-block">

                                <span class="dossier-field-label">
                                    LEVEL
                                </span>

                                <span
                                    class="level-badge dossier-level-badge"
                                    id="level-badge"
                                >
                                    Lv. 1
                                </span>


                                <div class="xp-bar dossier-xp-bar">

                                    <div
                                        class="xp-fill"
                                        id="xp-fill"
                                        style="width: 0%"
                                    ></div>

                                    <span
                                        class="xp-text"
                                        id="xp-text"
                                    >
                                        0 / 100 XP
                                    </span>

                                </div>


                                <div class="currency-info dossier-currency">

                                    <div class="currency-item">

                                        <span
                                            class="currency-icon"
                                            aria-hidden="true"
                                        ></span>

                                        <span
                                            class="currency-amount"
                                            id="coins-amount"
                                        >
                                            0
                                        </span>

                                    </div>


                                    <div class="currency-item">

                                        <span
                                            class="currency-icon currency-icon--gems"
                                            aria-hidden="true"
                                        ></span>

                                        <span
                                            class="currency-amount"
                                            id="gems-amount"
                                        >
                                            0
                                        </span>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                </section>

            </aside>
        </div>

    </div>
    
    <script
        type="module"
        src="../js/modules/profile_entry.js"
    ></script>

</body>

</html>
