<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Edit Profile</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../style/themes.css">
  <link rel="stylesheet" href="../style/components.css">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../style/profile-manager.css">
  <link rel="stylesheet" href="../style/personnel-modification-terminal.css">

  <link
    rel="icon"
    href="https://calwzopyjitbtahiafzw.supabase.co/storage/v1/object/sign/web-pic/icon/avt_libai.jpg?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV84Mzg1MDYzNy1jNjQwLTQwYjQtYTk0OS1hODY4YmI0Yzk2YmMiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ3ZWItcGljL2ljb24vYXZ0X2xpYmFpLmpwZyIsImlhdCI6MTc2NjAzNzcwMywiZXhwIjo4NjU2OTg4MTg1MDN9.1JSZExUNh3_1uiHZ00ayOskz7UX3S3DpVEtKPkKVwu8"
    type="image/jpeg"
  >
</head>


<body class="pmt-page">

  <div class="profile-container pmt-facility">

    <!-- HEADER -->
    <header
      class="pmt-header pmt-panel"
      aria-label="Edit profile"
    >

      <div class="pmt-header-main">

        <span class="pmt-module-id">
          [PMT-001]
        </span>

        <div class="pmt-header-text">

          <h1>
            EDIT PROFILE
          </h1>

          <p class="pmt-system-desc">
            Personal Account Settings
          </p>

        </div>

      </div>


      <div
        class="pmt-header-meta"
        aria-label="Profile status"
      >

        <span class="pmt-meta-line pmt-meta-line--live">
          STATUS: ACTIVE
        </span>

      </div>

    </header>


    <!-- MAIN -->
    <div class="pmt-layout">

      <!-- PROFILE PHOTO -->
      <aside
        class="pmt-identity-panel pmt-panel"
        aria-label="Profile photo"
      >

        <div class="pmt-panel-label">

          <span class="pmt-panel-title">
            PROFILE PHOTO
          </span>

        </div>


        <div
          class="pmt-panel-divider"
          aria-hidden="true"
        ></div>


        <section class="profile-section avatar-section pmt-avatar-section">

          <div class="avatar-upload-container pmt-avatar-upload">

            <div class="avatar-preview-wrapper pmt-photo-frame">

              <img
                id="avatarPreview"
                src="/default-avatar.png"
                alt="Profile avatar"
                class="avatar-preview"
              >

            </div>


            <div class="avatar-upload-controls pmt-upload-controls">

              <label
                for="userAvatarInput"
                class="upload-btn pmt-upload-btn"
              >

                <svg
                  class="pmt-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="square"
                  aria-hidden="true"
                >
                  <path d="M12 16V4M8 8l4-4 4 4" />
                  <path d="M4 20h16" />
                </svg>

                <span>
                  UPLOAD PHOTO
                </span>

                <input
                  type="file"
                  id="userAvatarInput"
                  accept="image/*"
                  style="display: none;"
                >

              </label>


              <p class="upload-hint pmt-upload-hint">
                Max 5MB · JPG/PNG
              </p>

            </div>

          </div>

        </section>

      </aside>


      <!-- MAIN CONTENT -->
      <main class="profile-content pmt-main">

        <!-- PERSONAL INFORMATION -->
        <section
          class="profile-section pmt-form-section pmt-panel"
        >

          <div class="pmt-panel-label">

            <span class="pmt-module-id-sm">
              [DAT-02]
            </span>

            <span class="pmt-panel-title">
              PROFILE
            </span>

          </div>


          <div
            class="pmt-panel-divider pmt-panel-divider--inset"
            aria-hidden="true"
          ></div>


          <h2 class="pmt-section-heading">
            PERSONAL INFORMATION
          </h2>


          <form class="profile-form pmt-form">

            <!-- USERNAME -->
            <div class="form-group pmt-field">

              <label for="username">
                USERNAME
              </label>

              <input
                type="text"
                id="username"
                readonly
              >

              <small class="form-hint pmt-field-hint">
                Username cannot be changed.
              </small>

            </div>


            <!-- EMAIL -->
            <div class="form-group pmt-field">

              <label for="email">
                EMAIL
              </label>

              <input
                type="email"
                id="email"
                placeholder="Enter your email"
              >

            </div>


            <!-- FULL NAME -->
            <div class="form-group pmt-field">

              <label for="fullName">
                FULL NAME
              </label>

              <input
                type="text"
                id="fullName"
                placeholder="Enter your full name"
              >

            </div>


            <!-- BIO -->
            <div class="form-group pmt-field">

              <label for="bio">
                BIO
              </label>

              <textarea
                id="bio"
                placeholder="Write something about yourself..."
                rows="4"
              ></textarea>

            </div>


            <button
              type="button"
              id="saveProfileBtn"
              class="btn-primary pmt-btn-primary"
            >
              SAVE PROFILE
            </button>

          </form>

        </section>


        <!-- PASSWORD -->
        <section
          class="profile-section pmt-form-section pmt-panel"
        >

          <div class="pmt-panel-label">

            <span class="pmt-module-id-sm">
              [SEC-03]
            </span>

            <span class="pmt-panel-title">
              PASSWORD
            </span>

          </div>


          <div
            class="pmt-panel-divider pmt-panel-divider--inset"
            aria-hidden="true"
          ></div>


          <h2 class="pmt-section-heading">
            CHANGE PASSWORD
          </h2>


          <form class="password-form pmt-form">

            <!-- NEW PASSWORD -->
            <div class="form-group pmt-field">

              <label for="newPassword">
                NEW PASSWORD
              </label>

              <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
              >

            </div>


            <!-- CONFIRM PASSWORD -->
            <div class="form-group pmt-field">

              <label for="confirmPassword">
                CONFIRM PASSWORD
              </label>

              <input
                type="password"
                id="confirmPassword"
                placeholder="Re-enter new password"
              >

            </div>


            <button
              type="button"
              id="changePasswordBtn"
              class="btn-secondary pmt-btn-secondary"
            >
              CHANGE PASSWORD
            </button>

          </form>

        </section>

      </main>

    </div>

  </div>


  <!-- PROFILE MANAGER -->
  <script
    type="module"
    src="../js/modules/profile_manager_entry.js"
  ></script>

</body>

</html>
