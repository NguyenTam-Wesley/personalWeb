<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Blog</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../style/themes.css" />
  <link rel="stylesheet" href="../style/components.css" />
  <link rel="stylesheet" href="../style/blog.css" />
  <link rel="stylesheet" href="../style/intelligence-reports.css" />

  <link
    rel="icon"
    href="https://calwzopyjitbtahiafzw.supabase.co/storage/v1/object/sign/web-pic/icon/avt_libai.jpg?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV84Mzg1MDYzNy1jNjQwLTQwYjQtYTk0OS1hODY4YmI0Yzk2YmMiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ3ZWItcGljL2ljb24vYXZ0X2xpYmFpLmpwZyIsImlhdCI6MTc2NjAzNzcwMywiZXhwIjo4NjU2OTg4MTg1MDN9.1JSZExUNh3_1uiHZ00ayOskz7UX3S3DpVEtKPkKVwu8"
  />
</head>

<body class="report-page">

  <main class="blog-container report-facility">

    <!-- HEADER -->
    <header
      class="blog-header report-header report-panel"
      aria-label="Blog Archive"
    >

      <div class="report-header-main">

        <span class="report-module-id">
          [RPT-001]
        </span>

        <div class="report-header-text">

          <h1>
            NTAM BLOG ARCHIVE
          </h1>

          <p>
            Personal Articles &amp; Publications
          </p>

        </div>

      </div>

      <div
        class="report-header-meta"
        aria-label="System status"
      >
        <span class="report-meta-line report-meta-line--live">
          STATUS: READY
        </span>
      </div>

      <!-- Admin only -->
      <div class="blog-controls report-controls">

        <button
          id="createPostBtn"
          class="btn-primary admin-only report-compose-btn"
          style="display: none;"
        >
          <span class="icon" aria-hidden="true"></span>
          NEW POST
        </button>

      </div>

    </header>


    <!-- MAIN LAYOUT -->
    <div class="report-layout">


      <!-- CATEGORIES -->
      <aside
        class="report-sidebar report-panel"
        aria-label="Blog categories"
      >

        <div class="report-panel-label">

          <span class="report-panel-title">
            CATEGORIES
          </span>

        </div>

        <div
          class="report-panel-divider"
          aria-hidden="true"
        ></div>

        <nav class="report-category-nav">

          <span class="report-category-entry report-category-entry--active">
            ALL POSTS
          </span>

          <span class="report-category-entry">
            TECHNICAL
          </span>

          <span class="report-category-entry">
            PERSONAL
          </span>

          <span class="report-category-entry">
            RESEARCH
          </span>

        </nav>

      </aside>


      <!-- BLOG CONTENT -->
      <div class="blog-content report-main">


        <!-- SEARCH & FILTER -->
        <div class="blog-filters report-filters report-panel">

          <div class="report-panel-label report-filters-label">

            <span class="report-module-id-sm">
              [QRY-02]
            </span>

            <span class="report-panel-title">
              SEARCH &amp; FILTER
            </span>

          </div>

          <div
            class="report-panel-divider report-panel-divider--inset"
            aria-hidden="true"
          ></div>


          <div class="report-filters-row">

            <!-- Search -->
            <div class="search-box report-search">

              <label
                for="searchInput"
                class="report-search-label"
              >
                SEARCH
              </label>

              <input
                type="text"
                id="searchInput"
                placeholder="Search posts..."
              />

              <span
                class="search-icon"
                aria-hidden="true"
              ></span>

            </div>


            <!-- Filters -->
            <div class="filter-options report-filter-options">

              <div class="report-select-wrap">

                <label
                  for="topicFilter"
                  class="report-field-label"
                >
                  CATEGORY
                </label>

                <select id="topicFilter">

                  <option value="">
                    All categories
                  </option>

                </select>

              </div>


              <div class="report-select-wrap">

                <label
                  for="sortFilter"
                  class="report-field-label"
                >
                  SORT
                </label>

                <select id="sortFilter">

                  <option value="newest">
                    Newest first
                  </option>

                  <option value="oldest">
                    Oldest first
                  </option>

                  <option value="popular">
                    Most accessed
                  </option>

                  <option value="most_liked">
                    Most referenced
                  </option>

                </select>

              </div>

            </div>

          </div>


          <!-- Tags -->
          <div class="report-tags-section">

            <span class="report-field-label report-tags-heading">
              TAGS
            </span>

            <div
              class="tag-filters report-tag-filters"
              id="tagFilters"
            >
              <!-- Tag filters populated by JavaScript -->
            </div>

          </div>

        </div>


        <!-- POSTS -->
        <div class="report-feed-header">

          <div class="report-panel-label">

            <span class="report-module-id-sm">
              [POST-03]
            </span>

            <span class="report-panel-title">
              POSTS
            </span>

          </div>

        </div>


        <div
          class="blog-posts report-feed"
          id="blogPosts"
        >

          <div class="loading-spinner report-loading">

            <div class="spinner"></div>

            <p>
              Loading posts...
            </p>

          </div>

        </div>


        <!-- PAGINATION -->
        <div
          class="blog-pagination report-pagination"
          id="pagination"
          style="display: none;"
        >

          <button
            class="pagination-btn"
            id="prevPage"
          >
            ← PREV
          </button>

          <div
            class="page-numbers"
            id="pageNumbers"
          ></div>

          <button
            class="pagination-btn"
            id="nextPage"
          >
            NEXT →
          </button>

        </div>

      </div>


      <!-- SIMPLE INFO -->
      <aside
        class="report-meta-panel report-panel"
        aria-label="Blog information"
      >

        <div class="report-panel-label">

          <span class="report-panel-title">
            BLOG
          </span>

        </div>

        <div
          class="report-panel-divider"
          aria-hidden="true"
        ></div>

        <dl class="report-meta-list">

          <div class="report-meta-row">

            <dt>STATUS</dt>

            <dd class="report-meta-value report-meta-value--ok">
              ONLINE
            </dd>

          </div>

          <div class="report-meta-row">

            <dt>CONTENT</dt>

            <dd>
              PUBLIC
            </dd>

          </div>

        </dl>

      </aside>

    </div>

  </main>


  <!-- CREATE POST MODAL -->
  <!-- DOM contract preserved -->

  <div
    id="createPostModal"
    class="modal report-modal"
  >

    <div class="modal-content report-modal-content">

      <div class="modal-header report-modal-header">

        <h2>
          NEW POST
        </h2>

        <button
          class="close-btn"
          id="closeCreateModal"
          aria-label="Close"
        >
          &times;
        </button>

      </div>


      <div class="modal-body">

        <form id="createPostForm">

          <div class="form-row">

            <div class="form-group">

              <label for="postTitle">
                Title *
              </label>

              <input
                type="text"
                id="postTitle"
                name="postTitle"
                required
                placeholder="Enter post title"
                maxlength="200"
              />

            </div>


            <div class="form-group">

              <label for="postTopic">
                Category *
              </label>

              <select
                id="postTopic"
                name="postTopic"
                required
              >

                <option value="">
                  Select category
                </option>

              </select>

            </div>

          </div>


          <div class="form-group">

            <label for="postContent">
              Content *
            </label>

            <div
              id="postContent"
              style="height: 300px;"
            ></div>

            <input
              type="hidden"
              name="postContent"
              id="postContentHidden"
              required
            />

          </div>


          <div class="form-row">

            <div class="form-group">

              <label for="postTags">
                Tags
              </label>

              <input
                type="text"
                id="postTags"
                name="postTags"
                placeholder="analysis, research, technical"
              />

            </div>


            <div class="form-group">

              <label for="postStatus">
                Status
              </label>

              <select
                id="postStatus"
                name="postStatus"
              >

                <option value="published">
                  Published
                </option>

                <option value="draft">
                  Draft
                </option>

              </select>

            </div>

          </div>


          <div class="form-actions">

            <button
              type="button"
              class="btn-secondary"
              id="cancelCreate"
            >
              Cancel
            </button>

            <button
              type="submit"
              class="btn-primary"
            >

              <span
                class="btn-icon"
                aria-hidden="true"
              ></span>

              Publish

            </button>

          </div>

        </form>

      </div>

    </div>

  </div>


  <!-- Quill -->
  <link
    href="https://cdn.quilljs.com/1.3.6/quill.snow.css"
    rel="stylesheet"
  />

  <script>

    window.QuillLoaded = false;

    var quillScript = document.createElement('script');

    quillScript.src =
      'https://cdn.quilljs.com/1.3.6/quill.js';

    quillScript.onload = function () {

      window.QuillLoaded = true;

      console.log('✅ Quill loaded successfully');

    };

    document.head.appendChild(quillScript);

  </script>


  <!-- Blog JS -->
  <script>

    function loadBlogScript() {

      if (
        window.QuillLoaded &&
        typeof Quill !== 'undefined'
      ) {

        console.log(
          '✅ Quill ready, loading blog script...'
        );

        const script =
          document.createElement('script');

        script.type = 'module';

        script.src =
          '../js/modules/blog_entry.js';

        document.head.appendChild(script);

      } else {

        console.log(
          '⏳ Waiting for Quill...'
        );

        setTimeout(
          loadBlogScript,
          50
        );

      }

    }

    loadBlogScript();

  </script>

</body>
</html>
