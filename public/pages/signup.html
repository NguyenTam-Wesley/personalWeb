<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Operator Registration</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../style/components.css" />
  <link rel="stylesheet" href="../style/themes.css" />
  <link rel="stylesheet" href="../style/auth.css" />

  <link
    rel="icon"
    href="https://calwzopyjitbtahiafzw.supabase.co/storage/v1/object/sign/web-pic/icon/avt_libai.jpg?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV84Mzg1MDYzNy1jNjQwLTQwYjQtYTk0OS1hODY4YmI0Yzk2YmMiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ3ZWItcGljL2ljb24vYXZ0X2xpYmFpLmpwZyIsImlhdCI6MTc2NjAzNzcwMywiZXhwIjo4NjU2OTg4MTg1MDN9.1JSZExUNh3_1uiHZ00ayOskz7UX3S3DpVEtKPkKVwu8"
  />
</head>

<body class="access-page access-page--signup">

  <main class="access-root">

    <!-- SYSTEM HEADER -->
    <header class="access-system-header">
      <div class="access-system-header-inner">

        <div class="access-system-header-main">

          <span class="access-system-module-id">
            [ACS-002]
          </span>

          <div class="access-system-header-text">

            <h1 class="access-system-name">
              NTAM ACCESS CONTROL
            </h1>

            <p class="access-system-desc">
              Operator Registration
            </p>

          </div>

        </div>

        <div class="access-system-header-meta">

          <span class="access-system-meta-item access-system-meta-item--live">
            NET: <strong>ONLINE</strong>
          </span>

          <span class="access-system-meta-item">
            BUILD: <strong>22.08.26</strong>
          </span>

        </div>

      </div>
    </header>


    <!-- REGISTRATION -->
    <section class="access-panel access-panel-reveal">

      <header class="access-header">

        <div class="access-header-badge">
          <span class="access-header-id">
            ACS-002
          </span>
        </div>

        <div class="access-header-text">

          <h2 class="auth-title access-header-title">
            CREATE ACCESS PROFILE
          </h2>

          <p class="auth-subtitle access-header-subtitle">
            Create your operator account
          </p>

        </div>

      </header>


      <form
        class="auth-form access-form"
        id="signupForm"
        novalidate
      >

        <!-- USERNAME -->
        <div class="form-group">

          <label
            for="username"
            class="form-label"
          >
            OPERATOR ID
          </label>

          <input
            type="text"
            id="username"
            name="username"
            class="form-input"
            placeholder="Choose operator ID"
            autocomplete="username"
            required
            aria-describedby="username-error"
          />

          <span
            id="username-error"
            class="error-message"
            role="alert"
          ></span>

        </div>


        <!-- PASSWORD -->
        <div class="form-group">

          <label
            for="password"
            class="form-label"
          >
            ACCESS KEY
          </label>

          <div class="password-wrapper">

            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="Minimum 6 characters"
              autocomplete="new-password"
              required
              aria-describedby="password-error password-rules"
            />

            <button
              type="button"
              class="password-toggle"
              id="passwordToggle"
              aria-label="Hiển thị mật khẩu"
            >
              👁️
            </button>

          </div>

          <span
            id="password-error"
            class="error-message"
            role="alert"
          ></span>


          <!-- PASSWORD REQUIREMENT -->
          <div
            class="password-rules"
            id="passwordRules"
          >

            <div class="password-rules-title">
              ACCESS KEY REQUIREMENTS
            </div>

            <div
              class="password-rule"
              id="rule-length"
            >
              <span class="password-rule-icon">
                ○
              </span>

              <span>
                Minimum 6 characters
              </span>
            </div>

          </div>

        </div>


        <!-- CONFIRM PASSWORD -->
        <div class="form-group">

          <label
            for="confirmPassword"
            class="form-label"
          >
            CONFIRM ACCESS KEY
          </label>

          <div class="password-wrapper">

            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              class="form-input"
              placeholder="Re-enter access key"
              autocomplete="new-password"
              required
              aria-describedby="confirmPassword-error"
            />

            <button
              type="button"
              class="password-toggle"
              id="confirmPasswordToggle"
              aria-label="Hiển thị mật khẩu"
            >
              👁️
            </button>

          </div>

          <span
            id="confirmPassword-error"
            class="error-message"
            role="alert"
          ></span>

        </div>


        <!-- REGISTER -->
        <div class="access-submit-block">

          <button
            type="submit"
            class="btn-primary"
            id="signupBtn"
          >

            <span id="signupBtnText">
              CREATE ACCOUNT
            </span>

            <span
              id="signupBtnSpinner"
              class="btn-spinner"
              style="display: none;"
            ></span>

          </button>

        </div>


        <!-- LOGIN -->
        <div class="auth-footer">

          Already registered?

          <a
            href="login.html"
            class="auth-footer-link"
          >
            SIGN IN
          </a>

        </div>

      </form>


      <!-- STATUS -->
      <footer
        class="access-terminal-footer"
        aria-hidden="true"
      >
        <span>AUTH: READY</span>
        <span>ENROLLMENT: ACTIVE</span>
      </footer>

    </section>

  </main>


  <script
    type="module"
    src="../js/modules/signup_entry.js"
  ></script>

</body>
</html>
