<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../style/components.css" />
  <link rel="stylesheet" href="../style/themes.css" />
  <link rel="stylesheet" href="../style/auth.css" />

  <link
    rel="icon"
    href="https://calwzopyjitbtahiafzw.supabase.co/storage/v1/object/sign/web-pic/icon/avt_libai.jpg?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV84Mzg1MDYzNy1jNjQwLTQwYjQtYTk0OS1hODY4YmI0Yzk2YmMiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ3ZWItcGljL2ljb24vYXZ0X2xpYmFpLmpwZyIsImlhdCI6MTc2NjAzNzcwMywiZXhwIjo4NjU2OTg4MTg1fQ..."
  />
</head>

<body class="access-page access-page--login">

  <main class="access-root">

    <!-- SYSTEM HEADER -->
    <header class="access-system-header">
      <div class="access-system-header-inner">

        <div class="access-system-header-main">
          <span class="access-system-module-id">[ACS-001]</span>

          <div class="access-system-header-text">
            <h1 class="access-system-name">
              NTAM ACCESS CONTROL
            </h1>

            <p class="access-system-desc">
              Operator Authentication
            </p>
          </div>
        </div>

        <div class="access-system-header-meta">
          <span class="access-system-meta-item access-system-meta-item--live">
            NET: <strong>ONLINE</strong>
          </span>

          <span class="access-system-meta-item">
            BUILD: <strong>22.08.26</strong>
          </span>
        </div>

      </div>
    </header>


    <!-- LOGIN -->
    <section class="access-panel access-panel-reveal">

      <header class="access-header">

        <div class="access-header-badge">
          <span class="access-header-id">ACS-001</span>
        </div>

        <div class="access-header-text">
          <h2 class="auth-title access-header-title">
            IDENTITY VERIFICATION
          </h2>

          <p class="auth-subtitle access-header-subtitle">
            Enter your operator credentials
          </p>
        </div>

      </header>


      <form
        class="auth-form access-form"
        id="loginForm"
        novalidate
      >

        <!-- USERNAME -->
        <div class="form-group">

          <label
            for="username"
            class="form-label"
          >
            OPERATOR ID
          </label>

          <input
            type="text"
            id="username"
            name="username"
            class="form-input"
            placeholder="Enter operator ID"
            autocomplete="username"
            required
            aria-describedby="username-error"
          />

          <span
            id="username-error"
            class="error-message"
            role="alert"
          ></span>

        </div>


        <!-- PASSWORD -->
        <div class="form-group">

          <label
            for="password"
            class="form-label"
          >
            ACCESS KEY
          </label>

          <div class="password-wrapper">

            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="Enter access key"
              autocomplete="current-password"
              required
              aria-describedby="password-error"
            />

            <button
              type="button"
              class="password-toggle"
              id="passwordToggle"
              aria-label="Hiển thị mật khẩu"
            >
              👁️
            </button>

          </div>

          <span
            id="password-error"
            class="error-message"
            role="alert"
          ></span>

        </div>


        <!-- FORGOT PASSWORD -->
        <div class="forgot-password">

          <a
            href="#"
            class="forgot-password-link"
            id="forgotPasswordLink"
          >
            FORGOT PASSWORD?
          </a>

        </div>


        <!-- LOGIN -->
        <div class="access-submit-block">

          <button
            type="submit"
            class="btn-primary"
            id="loginBtn"
          >
            <span id="loginBtnText">
              SIGN IN
            </span>

            <span
              id="loginBtnSpinner"
              class="btn-spinner"
              style="display: none;"
            ></span>
          </button>

        </div>


        <!-- REGISTER -->
        <div class="auth-footer">

          New operator?

          <a
            href="signup.html"
            class="auth-footer-link"
          >
            CREATE ACCOUNT
          </a>

        </div>

      </form>


      <!-- STATUS -->
      <footer
        class="access-terminal-footer"
        aria-hidden="true"
      >
        <span>AUTH: READY</span>
        <span>SESSION: INACTIVE</span>
      </footer>

    </section>

  </main>


  <script
    type="module"
    src="../js/modules/login_entry.js"
  ></script>

</body>
</html>
