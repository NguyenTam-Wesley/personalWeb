<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Documentation</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../style/components.css" />
  <link rel="stylesheet" href="../style/themes.css" />
  <link rel="stylesheet" href="../style/study.css" />

  <link
    rel="icon"
    href="https://calwzopyjitbtahiafzw.supabase.co/storage/v1/object/sign/web-pic/icon/avt_libai.jpg?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV84Mzg1MDYzNy1jNjQwLTQwYjQtYTk0OS1hODY4YmI0Yzk2YmMiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ3ZWItcGljL2ljb24vYXZ0X2xpYmFpLmpwZyIsImlhdCI6MTc2NjAzNzcwMywiZXhwIjo4NjU2OTg4MTg1MDN9.1JSZExUNh3_1uiHZ00ayOskz7UX3S3DpVEtKPkKVwu8"
    type="image/jpeg"
  />
</head>


<body class="study-page">

  <main class="study-container">

    <div class="study-archive">

      <!-- HEADER -->
      <header class="study-archive-header study-panel">

        <div class="study-module-id">
          [STU-001]
        </div>

        <div class="study-header-body">

          <h1 class="study-system-name">
            Study Documentation
          </h1>

          <p class="study-system-desc">
            Documentation Library
          </p>

        </div>

        <div class="study-header-meta">

          <span class="study-status-badge">
            <span
              class="study-status-badge-icon"
              aria-hidden="true"
            ></span>

            <span>READY</span>
          </span>

        </div>

      </header>


      <!-- MAIN -->
      <div class="study-layout">


        <!-- SUBJECTS -->
        <aside
          class="study-index-panel study-panel"
          aria-label="Knowledge index"
        >

          <div class="study-panel-label">

            <span class="study-module-id-sm">
              [IDX]
            </span>

            <span class="study-panel-title">
              SUBJECTS
            </span>

          </div>

          <div
            class="study-panel-divider"
            aria-hidden="true"
          ></div>

          <nav class="study-index-nav">

            <span class="study-index-entry">
              ALL DOCUMENTS
            </span>

            <span class="study-index-entry">
              STUDY
            </span>

            <span class="study-index-entry">
              RESEARCH
            </span>

            <span class="study-index-entry">
              REFERENCE
            </span>

          </nav>

        </aside>


        <!-- CONTENT -->
        <div class="study-main-panel">


          <!-- SUBJECT REGISTRY -->
          <section
            class="study-categories study-panel"
            aria-labelledby="categories-heading"
          >

            <div class="study-panel-label">

              <span class="study-module-id-sm">
                [CAT]
              </span>

              <span
                class="study-panel-title"
                id="categories-heading"
              >
                SUBJECTS
              </span>

            </div>

            <div
              class="study-panel-divider"
              aria-hidden="true"
            ></div>

            <section
              id="subjects"
              class="subjects-grid"
            ></section>

          </section>


          <!-- SEARCH / FILTER -->
          <div
            id="controls"
            class="controls-panel study-panel"
            hidden
          >

            <div class="controls-panel-inner">

              <div class="study-panel-label">

                <span class="study-module-id-sm">
                  [QRY]
                </span>

                <span class="study-panel-title">
                  SEARCH
                </span>

              </div>

              <div
                class="study-panel-divider"
                aria-hidden="true"
              ></div>


              <div class="study-query-row">


                <!-- SEARCH -->
                <div class="search-container">

                  <label
                    for="searchInput"
                    class="study-search-label"
                  >
                    SEARCH
                  </label>

                  <div class="study-search-field">

                    <span
                      class="study-search-icon"
                      aria-hidden="true"
                    ></span>

                    <input
                      type="text"
                      id="searchInput"
                      placeholder="Search documents..."
                    />

                  </div>

                </div>


                <!-- FILTER -->
                <div class="filters-container">

                  <label
                    class="study-filter-label"
                    for="typeFilter"
                  >
                    TYPE
                  </label>

                  <select
                    id="typeFilter"
                    class="filter-select"
                  >

                    <option value="">
                      All types
                    </option>

                  </select>


                  <label
                    class="study-filter-label"
                    for="sortSelect"
                  >
                    SORT
                  </label>

                  <select
                    id="sortSelect"
                    class="filter-select"
                  >

                    <option value="az">
                      Name A-Z
                    </option>

                    <option value="za">
                      Name Z-A
                    </option>

                  </select>

                </div>

              </div>

            </div>

          </div>


          <!-- DOCUMENTS -->
          <section
            class="study-documents-wrap study-panel"
            aria-labelledby="documents-heading"
          >

            <div class="study-panel-label">

              <span class="study-module-id-sm">
                [DOC]
              </span>

              <span
                class="study-panel-title"
                id="documents-heading"
              >
                DOCUMENTS
              </span>

            </div>

            <div
              class="study-panel-divider"
              aria-hidden="true"
            ></div>


            <!-- TABLE HEADER -->
            <div
              class="study-doc-table-header"
              aria-hidden="true"
            >

              <span class="study-col study-col-id">
                ID
              </span>

              <span class="study-col study-col-title">
                TITLE
              </span>

              <span class="study-col study-col-type">
                TYPE
              </span>

              <span class="study-col study-col-access">
                ACCESS
              </span>

            </div>


            <!-- DOCUMENT LIST -->
            <section
              id="documents"
              class="documents-grid"
            ></section>

          </section>

        </div>

      </div>

    </div>

  </main>


  <script
    type="module"
    src="../js/modules/study_entry.js"
  ></script>

</body>

</html>
